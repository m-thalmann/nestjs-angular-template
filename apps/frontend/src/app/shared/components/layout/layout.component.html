<header>
  <div class="header-container">
    <h1 class="title">
      <a routerLink="/">
        <img src="assets/images/icon.png" alt="App Logo" />
        @nestjs-angular-template
      </a>
    </h1>

    <div>Menu</div>

    <div class="actions">
      <p-avatar label="JD" shape="circle" (click)="menu.toggle($event)" />
      <p-tieredMenu #menu [model]="userMenu()" [popup]="true" />
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>
